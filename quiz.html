<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Edukasi</title>
<style>
  :root {
    --bg-primary: #f0f2f5;
    --bg-secondary: #ffffff;
    --bg-chat: #efeae2;
    --bg-header: #f0f2f5;
    --bg-message-sent: #d9fdd3;
    --bg-message-received: #ffffff;
    --bg-input: #ffffff;
    --bg-quick-reply: #f0f2f5;
    --text-primary: #111b21;
    --text-secondary: #667781;
    --text-muted: #8696a0;
    --accent: #00a884;
    --accent-hover: #008069;
    --border-color: #e9edef;
    --shadow: rgba(0,0,0,0.1);
    --correct: #00a884;
    --wrong: #b33a3a;
    --skip: #f0b429;
    --timer-bg: #fff3cd;
    --timer-text: #856404;
  }

  [data-theme="dark"] {
    --bg-primary: #111b21;
    --bg-secondary: #202c33;
    --bg-chat: #0b141a;
    --bg-header: #202c33;
    --bg-message-sent: #005c4b;
    --bg-message-received: #202c33;
    --bg-input: #2a3942;
    --bg-quick-reply: #202c33;
    --text-primary: #e9edef;
    --text-secondary: #8696a0;
    --text-muted: #8696a0;
    --accent: #00a884;
    --accent-hover: #00c49a;
    --border-color: #2a3942;
    --shadow: rgba(0,0,0,0.5);
    --skip: #f0b429;
    --timer-bg: #3d3200;
    --timer-text: #ffd700;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg-primary: #111b21;
      --bg-secondary: #202c33;
      --bg-chat: #0b141a;
      --bg-header: #202c33;
      --bg-message-sent: #005c4b;
      --bg-message-received: #202c33;
      --bg-input: #2a3942;
      --bg-quick-reply: #202c33;
      --text-primary: #e9edef;
      --text-secondary: #8696a0;
      --text-muted: #8696a0;
      --accent: #00a884;
      --accent-hover: #00c49a;
      --border-color: #2a3942;
      --shadow: rgba(0,0,0,0.5);
      --skip: #f0b429;
      --timer-bg: #3d3200;
      --timer-text: #ffd700;
    }
  }

  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Tahoma,sans-serif; }
  
  body { 
    background:var(--bg-primary); 
    display:flex; 
    justify-content:center; 
    align-items:center; 
    min-height:100vh;
    transition:background 0.3s ease;
  }
  
  .phone-frame { 
    width:100%; 
    max-width:420px; 
    height:100vh; 
    max-height:750px; 
    background:var(--bg-secondary); 
    border-radius:20px; 
    overflow:hidden; 
    box-shadow:0 20px 60px var(--shadow); 
    display:flex; 
    flex-direction:column;
    transition:background 0.3s ease;
    position:relative;
  }
  @media(min-width:500px){ .phone-frame{height:750px;} }

  /* Header */
  .chat-header { 
    background:var(--bg-header); 
    padding:10px 16px; 
    display:flex; 
    align-items:center; 
    gap:12px; 
    min-height:60px;
    border-bottom:1px solid var(--border-color);
  }
  .avatar { 
    width:40px; height:40px; border-radius:50%; 
    background:linear-gradient(135deg,var(--accent),var(--accent-hover)); 
    display:flex; align-items:center; justify-content:center; 
    color:white; font-weight:bold; font-size:18px; 
  }
  .contact-info { flex:1; }
  .contact-name { color:var(--text-primary); font-size:16px; font-weight:500; }
  .contact-status { color:var(--text-secondary); font-size:12px; margin-top:1px; }
  .header-icons { color:var(--text-secondary); font-size:14px; display:flex; gap:12px; align-items:center; }
  .header-icons span { display:flex; align-items:center; gap:4px; }
  
  .theme-toggle {
    cursor:pointer; padding:4px; border-radius:50%;
    transition:background 0.2s;
  }
  .theme-toggle:hover { background:var(--bg-quick-reply); }

  /* Menu (titik tiga) */
  .menu-wrap { position:relative; }
  .menu-toggle {
    cursor:pointer; padding:4px; border-radius:50%;
    transition:background 0.2s; color:var(--text-secondary);
    display:flex; align-items:center; justify-content:center;
  }
  .menu-toggle:hover { background:var(--bg-quick-reply); }
  .menu-dropdown {
    position:absolute; top:38px; right:0;
    background:var(--bg-secondary); border:1px solid var(--border-color);
    border-radius:10px; box-shadow:0 4px 16px var(--shadow);
    min-width:190px; overflow:hidden; z-index:20;
  }
  .menu-item {
    display:flex; align-items:center; gap:10px;
    padding:11px 14px; color:var(--text-primary); font-size:14px;
    cursor:pointer; text-decoration:none; background:none; border:none; width:100%;
    text-align:left;
  }
  .menu-item:hover { background:var(--bg-quick-reply); }
  .menu-item svg { width:18px; height:18px; flex-shrink:0; }
  .menu-divider { height:1px; background:var(--border-color); margin:4px 0; }

  /* About Modal */
  .modal-overlay {
    position:absolute; inset:0; background:rgba(0,0,0,0.5);
    display:flex; align-items:center; justify-content:center;
    z-index:30; padding:24px;
  }
  .modal-box {
    background:var(--bg-secondary); border-radius:14px; padding:22px;
    max-width:320px; width:100%; box-shadow:0 8px 24px var(--shadow);
    animation:fadeIn .25s ease;
  }
  .modal-box h3 { color:var(--text-primary); font-size:17px; margin-bottom:10px; display:flex; align-items:center; gap:8px; }
  .modal-box p { color:var(--text-secondary); font-size:13.5px; line-height:1.6; margin-bottom:16px; }
  .modal-close {
    background:var(--accent); color:white; border:none; padding:9px 18px;
    border-radius:8px; cursor:pointer; font-size:14px; width:100%; font-weight:500;
  }
  .modal-close:hover { background:var(--accent-hover); }

  /* Timer Badge */
  .timer-badge {
    background:var(--timer-bg);
    color:var(--timer-text);
    padding:4px 10px;
    border-radius:12px;
    font-size:13px;
    font-weight:bold;
    font-family:'Courier New',monospace;
    display:flex;
    align-items:center;
    gap:4px;
  }
  .timer-badge svg { width:14px; height:14px; }

  /* Progress Bar */
  .progress-bar { height:3px; background:var(--bg-quick-reply); width:100%; }
  .progress-fill { height:100%; background:var(--accent); width:0%; transition:width .4s ease; }

  /* Chat Area */
  .chat-area { 
    flex:1; 
    overflow-y:auto; 
    padding:16px; 
    background:var(--bg-chat); 
    display:flex; 
    flex-direction:column; 
    gap:4px;
  }
  .chat-area::-webkit-scrollbar { width:6px; }
  .chat-area::-webkit-scrollbar-thumb { background:var(--text-muted); border-radius:3px; }

  .message { 
    max-width:85%; 
    padding:8px 12px; 
    border-radius:8px; 
    position:relative; 
    margin-bottom:2px; 
    word-wrap:break-word; 
    line-height:1.4; 
    font-size:14px; 
    animation:fadeIn .3s ease;
    color:var(--text-primary);
    box-shadow:0 1px 2px var(--shadow);
  }
  @keyframes fadeIn { from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);} }

  .msg-bot { 
    background:var(--bg-message-received); 
    align-self:flex-start; 
    border-top-left-radius:0; 
  }
  .msg-bot::before { 
    content:''; position:absolute; top:0; left:-8px; 
    width:8px; height:13px; background:var(--bg-message-received); 
    clip-path:polygon(100% 0,0 0,100% 100%); 
  }
  .msg-user { 
    background:var(--bg-message-sent); 
    align-self:flex-end; 
    border-top-right-radius:0; 
  }
  .msg-user::before { 
    content:''; position:absolute; top:0; right:-8px; 
    width:8px; height:13px; background:var(--bg-message-sent); 
    clip-path:polygon(0 0,100% 0,0 100%); 
  }

  .msg-meta { 
    float:right; display:flex; align-items:center; gap:3px; 
    margin-top:2px; margin-left:8px; position:relative; top:5px; 
    font-size:11px; color:var(--text-secondary); 
  }

  /* Question Timer Display */
  .question-timer {
    display:inline-block;
    background:var(--timer-bg);
    color:var(--timer-text);
    padding:2px 8px;
    border-radius:10px;
    font-size:11px;
    font-weight:bold;
    margin-left:6px;
    font-family:'Courier New',monospace;
  }

  /* Review Badge */
  .review-badge {
    display:inline-block;
    background:var(--skip);
    color:#fff;
    padding:2px 8px;
    border-radius:10px;
    font-size:11px;
    font-weight:bold;
    margin-right:6px;
  }

  /* Media */
  .media-container {
    margin: -4px -8px 8px -8px;
    border-radius: 6px;
    overflow: hidden;
  }
  .media-container img, .media-container video {
    width: 100%; max-height: 250px; display: block;
  }
  .media-container audio { width: 100%; margin-top: 4px; }
  .media-placeholder {
    width: 100%; height: 150px; background: var(--bg-quick-reply);
    display: flex; align-items: center; justify-content: center;
    color: var(--text-secondary); font-size: 40px;
  }

  /* Typing */
  .typing { 
    align-self:flex-start; background:var(--bg-message-received); 
    padding:12px 16px; border-radius:8px; border-top-left-radius:0; 
    display:flex; gap:4px; align-items:center;
    box-shadow:0 1px 2px var(--shadow);
  }
  .typing-dot { 
    width:8px; height:8px; background:var(--text-secondary); 
    border-radius:50%; animation:bounce 1.4s infinite; 
  }
  .typing-dot:nth-child(2){animation-delay:.2s;} 
  .typing-dot:nth-child(3){animation-delay:.4s;}
  @keyframes bounce { 0%,60%,100%{transform:translateY(0);opacity:.4;} 30%{transform:translateY(-6px);opacity:1;} }

  /* Input */
  .input-area { 
    background:var(--bg-header); 
    padding:8px 10px; 
    display:flex; 
    align-items:center; 
    gap:8px;
    border-top:1px solid var(--border-color);
  }
  .input-box { 
    flex:1; background:var(--bg-input); border-radius:8px; 
    padding:9px 14px; border:1px solid var(--border-color);
  }
  .input-box input { 
    width:100%; background:transparent; border:none; outline:none; 
    color:var(--text-primary); font-size:14px; 
  }
  .input-box input::placeholder { color:var(--text-secondary); }
  .send-btn { 
    width:42px; height:42px; border-radius:50%; 
    background:var(--accent); display:flex; 
    align-items:center; justify-content:center; 
    color:white; cursor:pointer; flex-shrink:0; border:none;
  }
  .send-btn:hover { background:var(--accent-hover); }

  /* Quick Replies */
  .quick-replies { 
    background:var(--bg-quick-reply); 
    padding:10px; 
    display:flex; 
    flex-wrap:wrap; 
    gap:8px; 
    justify-content:center; 
    border-top:1px solid var(--border-color);
  }
  .qr-btn { 
    background:var(--bg-message-sent); 
    color:var(--text-primary); 
    border:none; 
    padding:10px 16px; 
    border-radius:20px; 
    cursor:pointer; 
    font-size:14px; 
    transition:all .2s; 
    min-width:80px;
    box-shadow:0 1px 2px var(--shadow);
  }
  .qr-btn:hover { background:var(--accent); color:white; transform:scale(1.03); }
  .qr-btn:disabled { opacity:.5; cursor:not-allowed; }
  .qr-btn.option { 
    background:var(--bg-input); 
    text-align:left; 
    padding:10px 14px; 
    border-radius:8px; 
    flex:1 1 100%;
    border:1px solid var(--border-color);
  }
  .qr-btn.option:hover { background:var(--bg-message-sent); }
  .qr-btn.option.correct { background:var(--correct); color:white; }
  .qr-btn.option.wrong { background:var(--wrong); color:white; }

  .opsi-img-wrap { margin-top:6px; border-radius:6px; overflow:hidden; }
  .opsi-img-wrap img { width:100%; max-height:160px; object-fit:cover; display:block; border-radius:6px; }
  
  /* Skip Button */
  .qr-btn.skip-btn {
    background:transparent;
    color:var(--skip);
    border:2px solid var(--skip);
    padding:8px 16px;
    font-weight:bold;
  }
  .qr-btn.skip-btn:hover {
    background:var(--skip);
    color:white;
  }

  /* Result */
  .result-card { 
    background:linear-gradient(135deg,var(--accent),var(--accent-hover)); 
    color:white; padding:20px; border-radius:12px; 
    align-self:center; max-width:90%; text-align:center; 
    animation:fadeIn .5s ease;
    box-shadow:0 4px 12px var(--shadow);
  }
  .result-card h2 { font-size:22px; margin-bottom:8px; }
  .result-card .score { font-size:48px; font-weight:bold; margin:10px 0; }
  .result-card .stats { 
    display:flex; justify-content:space-around; margin:15px 0;
    background:rgba(255,255,255,0.15); padding:10px; border-radius:8px;
  }
  .result-card .stat-item { text-align:center; }
  .result-card .stat-value { font-size:20px; font-weight:bold; }
  .result-card .stat-label { font-size:11px; opacity:0.9; }
  .result-card .motivation { font-size:14px; margin:10px 0; font-style:italic; }
  .result-card a { 
    display:inline-block; margin-top:12px; background:white; 
    color:var(--accent); padding:10px 20px; border-radius:20px; 
    text-decoration:none; font-weight:bold;
  }
  .result-card a:hover { transform:scale(1.05); }

  .hidden { display:none !important; }

/* Refresh btn */
  .refresh-btn {
	  margin-top: 20px;
	  padding: 12px 24px;
	  border: none;
	  border-radius: 25px;
	  background: #25D366;
	  color: white;
	  font-size: 16px;
	  cursor: pointer;
	  transition: 0.3s;
	}

	.refresh-btn:hover {
	  background: #128C7E;
	  transform: scale(1.05);
	}
</style>
</head>

<script>

// ============ STATE ============
const state = {
  step: 'init',
  questions: [],
  currentIndex: 0,
  score: 0,
  answered: false,
  // NEW: Skip & Timer
  skippedQuestions: [],      // array of {originalIndex, timeSpent}
  currentQuestionStartTime: 0,
  totalTimeSpent: 0,         // total detik
  totalTimerInterval: null,  // interval untuk total timer
  isReviewMode: false,       // apakah sedang review soal skip
  reviewQueue: [],           // queue soal yang akan di-review

const chatArea = document.getElementById('chatArea');
const quickReplies = document.getElementById('quickReplies');
const inputArea = document.getElementById('inputArea');

const sendBtn = document.getElementById('sendBtn');

const scoreDisplay = document.getElementById('scoreDisplay');

// ============ UTILS ============
function getTime() {
  const n = new Date();
  return n.getHours().toString().padStart(2,'0') + ':' + n.getMinutes().toString().padStart(2,'0');
}

function scrollBottom() { chatArea.scrollTop = chatArea.scrollHeight; }

function escapeHtml(t) {
  const d = document.createElement('div');
  d.textContent = t;
  return d.innerHTML;
}

function formatTime(seconds) {
  const m = Math.floor(seconds / 60).toString().padStart(2, '0');
  const s = (seconds % 60).toString().padStart(2, '0');
  return `${m}:${s}`;
}

function isImageUrl(str) {
  if (!str || typeof str !== 'string') return false;
  return /^https?:\/\//i.test(str.trim()) && /\.(jpg|jpeg|png|gif|webp)(\?.*)?$/i.test(str.trim());
}

// ============ TOTAL TIMER ============
function startTotalTimer() {
  if (state.totalTimerInterval) clearInterval(state.totalTimerInterval);
  state.totalTimerInterval = setInterval(() => {
    state.totalTimeSpent++;
    totalTimerEl.textContent = formatTime(state.totalTimeSpent);
  }, 1000);
  timerBadge.style.display = 'flex';
}

function stopTotalTimer() {
  if (state.totalTimerInterval) {
    clearInterval(state.totalTimerInterval);
    state.totalTimerInterval = null;
  }
}

// ============ BOT MESSAGE ============
function addBotMessage(text, delay = 800) {
  return new Promise(resolve => {
    const typing = document.createElement('div');
    typing.className = 'typing';
    typing.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
    chatArea.appendChild(typing);
    scrollBottom();
    statusText.textContent = 'sedang mengetik...';

    setTimeout(() => {
      typing.remove();
      statusText.textContent = 'online';
      const msg = document.createElement('div');
      msg.className = 'message msg-bot';
      msg.innerHTML = `${text}<span class="msg-meta">${getTime()}</span>`;
      chatArea.appendChild(msg);

}

function addUserMessage(text) {
  const msg = document.createElement('div');
  msg.className = 'message msg-user';
  msg.innerHTML = `${escapeHtml(text)}<span class="msg-meta">${getTime()}</span>`;
  chatArea.appendChild(msg);
  scrollBottom();
}

function addUserMessageHTML(html) {
  const msg = document.createElement('div');
  msg.className = 'message msg-user';
  msg.innerHTML = `${html}<span class="msg-meta">${getTime()}</span>`;
  chatArea.appendChild(msg);

function showQuickReplies(options, type = 'button') {
  quickReplies.innerHTML = '';
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'qr-btn' + (type === 'option' ? ' option' : '') + (opt.className ? ' ' + opt.className : '');
    btn.innerHTML = opt.label;
    if (opt.value && ['A','B','C','D'].includes(opt.value)) btn.dataset.letter = opt.value;
    btn.onclick = () => {
      if (state.answered && type === 'option') return;
      quickReplies.querySelectorAll('button').forEach(b => b.disabled = true);
      opt.action(opt.value, btn);
    };
    quickReplies.appendChild(btn);
  });
  quickReplies.classList.remove('hidden');
  inputArea.classList.add('hidden');
}

function hideQuickReplies() {
  quickReplies.classList.add('hidden');
  inputArea.classList.remove('hidden');
}

function showTextInput(placeholder = 'Ketik pesan...') {
  userInput.placeholder = placeholder;
  userInput.value = '';
  hideQuickReplies();
  userInput.focus();
}

function updateProgress() {
  if (state.questions.length === 0) { progressFill.style.width = '0%'; return; }
  const pct = (state.currentIndex / state.questions.length) * 100;
  progressFill.style.width = pct + '%';
}

// ============ NETWORK (Google Sheets - Publish to Web CSV) ============

// Parser CSV sederhana yang tetap menghormati tanda kutip (menangani koma/baris baru di dalam sel)
function parseCSV(text) {
  const rows = [];
  let row = [];
  let cur = '';
  let inQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    const next = text[i + 1];

    if (inQuotes) {
      if (c === '"' && next === '"') { cur += '"'; i++; }
      else if (c === '"') { inQuotes = false; }
      else { cur += c; }
    } else {
      if (c === '"') { inQuotes = true; }
      else if (c === ',') { row.push(cur); cur = ''; }
      else if (c === '\r') { /* skip */ }
      else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
      else { cur += c; }
    }
  }
  // baris terakhir (jika file tidak diakhiri newline)
  if (cur.length > 0 || row.length > 0) { row.push(cur); rows.push(row); }

  return rows.filter(r => r.some(cell => cell.trim() !== ''));
}

// Alias nama kolom -> field standar yang dipakai kode quiz
// Tambahkan alias baru di sini kalau nama kolom sheet kamu berbeda
const HEADER_ALIASES = {
  'soal': 'soal', 'pertanyaan': 'soal', 'question': 'soal',
  'opsia': 'opsiA', 'opsi a': 'opsiA', 'a': 'opsiA', 'pilihan a': 'opsiA',
  'opsib': 'opsiB', 'opsi b': 'opsiB', 'b': 'opsiB', 'pilihan b': 'opsiB',
  'opsic': 'opsiC', 'opsi c': 'opsiC', 'c': 'opsiC', 'pilihan c': 'opsiC',
  'opsid': 'opsiD', 'opsi d': 'opsiD', 'd': 'opsiD', 'pilihan d': 'opsiD',
  'jawaban': 'jawaban', 'kunci jawaban': 'jawaban', 'kunci': 'jawaban', 'answer': 'jawaban',
  'media': 'media', 'gambar': 'media', 'lampiran': 'media',
  'mediatype': 'mediaType', 'media type': 'mediaType', 'tipe media': 'mediaType', 'jenis media': 'mediaType'
};

function normalizeHeader(h) {
  const key = h.trim().toLowerCase();
  return HEADER_ALIASES[key] || h.trim();
}

// Ambil CSV dari link "Publish to web" Google Sheets, lalu ubah jadi array objek soal.
// Nama kolom di sheet bebas (lihat HEADER_ALIASES di atas), yang penting artinya:
// soal, opsiA, opsiB, opsiC, opsiD, jawaban, media, mediaType
async function fetchQuestionsFromCSV(url) {
  // cache-buster supaya selalu ambil data terbaru dari Google Sheets
  const bustedUrl = url + (url.includes('?') ? '&' : '?') + '_=' + Date.now();
  const res = await fetch(bustedUrl, { cache: 'no-store' });
  if (!res.ok) throw new Error('Gagal mengambil data CSV (status ' + res.status + ')');
  const text = await res.text();

  const rows = parseCSV(text);
  if (rows.length < 2) return [];

  const headers = rows[0].map(h => normalizeHeader(h));
  const questions = [];

  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    const obj = {};
    headers.forEach((h, idx) => { obj[h] = (r[idx] !== undefined ? r[idx] : '').trim(); });
    // lewati baris kosong (tidak ada teks soal)
    if (!obj.soal) continue;
    questions.push(obj);
  }
  return questions;
}

// ============ MEDIA ============
function renderMedia(mediaUrl, mediaType) {
  if (!mediaUrl || mediaUrl.trim() === '') return '';
  const container = document.createElement('div');
  container.className = 'media-container';
  
  if (mediaType === 'image' || mediaUrl.match(/\.(jpg|jpeg|png|gif|webp)$/i)) {
    const img = document.createElement('img');
    img.src = mediaUrl;
    img.alt = 'Soal Image';
    img.onerror = () => { container.innerHTML = '<div class="media-placeholder">🖼️</div>'; };
    container.appendChild(img);
  } else if (mediaType === 'video' || mediaUrl.match(/\.(mp4|webm|ogg)$/i)) {
    const video = document.createElement('video');
    video.controls = true; video.src = mediaUrl;
    container.appendChild(video);
  } else if (mediaType === 'audio' || mediaUrl.match(/\.(mp3|wav|ogg|m4a)$/i)) {
    const audio = document.createElement('audio');
    audio.controls = true; audio.src = mediaUrl;
    container.appendChild(audio);
  } else if (mediaUrl.includes('youtube.com') || mediaUrl.includes('youtu.be')) {
    let videoId = '';
    if (mediaUrl.includes('v=')) videoId = mediaUrl.split('v=')[1]?.split('&')[0];
    else videoId = mediaUrl.split('/').pop();
    container.innerHTML = `<iframe width="100%" height="200" src="https://www.youtube.com/embed/${videoId}" frameborder="0" allowfullscreen></iframe>`;
  } else {
    container.innerHTML = '<div class="media-placeholder">🔗</div>';
  }
  return container.outerHTML;
}

// ============ QUIZ FLOW ============
async function startQuiz() {
  if (!CSV_URL) {
    statusText.textContent = 'belum terhubung';
    await addBotMessage('👋 Quiz ini belum terhubung ke soal manapun.');
    await addBotMessage('🔗 Link yang kamu buka belum menyertakan link soal (parameter <b>csv</b>). Kalau kamu guru, buat link quiz kamu sendiri lewat halaman <b>generator</b> yang disediakan.');
    return;
  }
  await addBotMessage('👋 Bismillah, Selamat datang di <b>' + escapeHtml(QUIZ_TITLE) + '</b> 🎓');
  await addBotMessage('Tunggu sebentar, soal sedang disiapkan... 🔥');
  statusText.textContent = 'mengambil soal...';
  try {
    state.questions = await fetchQuestionsFromCSV(CSV_URL);
    if (state.questions.length === 0) throw new Error('Soal kosong, belum ada soal di database kita');
    await addBotMessage(`📝 Ada <b>${state.questions.length}</b> soal untukmu.`);
    await addBotMessage('💡 <b>Tips:</b> Kamu bisa <b>melewati</b> soal yang sulit dan kembali menjawabnya nanti. Tapi ingat, <b>waktu terus berjalan</b>! ⏱️');
    state.step = 'question';
    state.currentIndex = 0;
    state.score = 0;
    state.totalTimeSpent = 0;
    state.skippedQuestions = [];
    state.answeredCorrectly = new Set();
    state.isReviewMode = false;
    updateProgress();
    startTotalTimer();
    showQuestion();
  } catch (err) {
    console.error(err);
    await addBotMessage('⚠️ Gagal memuat soal.<br><span style="font-size:12px;opacity:.8;">' + escapeHtml(err.message) + '</span><br>Pastikan file ini dibuka lewat server web (bukan dibuka langsung dari file lokal), dan cek koneksi internet.');
  }
}

// ============ SHOW QUESTION ============
async function showQuestion() {
  const q = state.questions[state.currentIndex];
  updateProgress();
  scoreDisplay.textContent = '⭐ ' + state.score;
  
  // Reset timer per soal
  state.currentQuestionStartTime = Date.now();
  state.answered = false;
  
  // Badge review jika di review mode
  let reviewBadge = '';
  if (state.isReviewMode) {
    reviewBadge = '<span class="review-badge">🔄 SOAL LEWATAN</span>';
  }
  
  let questionHtml = `${reviewBadge}<b>Soal ${state.currentIndex + 1} dari ${state.questions.length}</b><br><br>${escapeHtml(q.soal)}`;
  
  if (q.media) {
    questionHtml += renderMedia(q.media, q.mediaType || '');
  }
  
  await addBotMessage(questionHtml);
  
  // Tombol opsi + skip
  function buildOptionLabel(letter, value) {
    if (isImageUrl(value)) {
      return `<b>${letter}.</b><div class="opsi-img-wrap"><img src="${value}" alt="Opsi ${letter}" onerror="this.parentElement.innerHTML='🖼️ Gagal memuat gambar';"></div>`;
    }
    return `<b>${letter}.</b> ${escapeHtml(value)}`;
  }
  const options = [
    { label: buildOptionLabel('A', q.opsiA), value: 'A', action: handleAnswer },
    { label: buildOptionLabel('B', q.opsiB), value: 'B', action: handleAnswer },
    { label: buildOptionLabel('C', q.opsiC), value: 'C', action: handleAnswer },
    { label: buildOptionLabel('D', q.opsiD), value: 'D', action: handleAnswer },
    { label: '⏭️ Lewati Soal', value: 'skip', action: handleSkip, className: 'skip-btn' }
  ];
  showQuickReplies(options, 'option');
}

// ============ HANDLE ANSWER ============
async function handleAnswer(answer, btn) {
  if (state.answered) return;
  state.answered = true;
  
  // Hitung waktu soal ini
  const timeSpent = Math.floor((Date.now() - state.currentQuestionStartTime) / 1000);
  
  const q = state.questions[state.currentIndex];
  const chosenValue = q['opsi' + answer];
  addUserAnswerBtn(answer, btn, q.jawaban, chosenValue);

  const isCorrect = answer === q.jawaban;
  if (isCorrect) {
    state.score += 10;
    state.answeredCorrectly.add(state.currentIndex);
    await addBotMessage(`✅ <b>Benar!</b> Maa syaa Allah, Kamu Hebat! 🎉 <span class="question-timer">⏱️ ${timeSpent}s</span>`);
  } else {
    const correctValue = q['opsi' + q.jawaban];
    const correctDisplay = isImageUrl(correctValue)
      ? `<div class="opsi-img-wrap" style="max-width:140px;margin-top:4px;"><img src="${correctValue}" alt="Jawaban ${q.jawaban}"></div>`
      : escapeHtml(correctValue);
    await addBotMessage(`❌ <b>oops.. Kurang tepat.</b><br>Jawaban yang benar adalah : <b>${q.jawaban}.</b> ${correctDisplay} <span class="question-timer">⏱️ ${timeSpent}s</span>`);
  }
  scoreDisplay.textContent = '⭐ ' + state.score;

  setTimeout(async () => {
    if (state.isReviewMode) {
      showNextReviewQuestion();
      return;
    }
    state.currentIndex++;
    if (state.currentIndex < state.questions.length) {
      showQuestion();
    } else {
      // Cek apakah ada soal yang di-skip
      checkSkippedQuestions();
    }
  }, 1800);
}

// ============ HANDLE SKIP ============
async function handleSkip(value, btn) {
  if (state.answered) return;
  state.answered = true;
  
  const timeSpent = Math.floor((Date.now() - state.currentQuestionStartTime) / 1000);
  
  // Simpan ke daftar skip
  state.skippedQuestions.push({
    originalIndex: state.currentIndex,
    timeSpent: timeSpent
  });
  
  addUserMessage('⏭️ Lewati soal ini');
  await addBotMessage(`⏭️ Baik, soal ini dilewati. <span class="question-timer">⏱️ ${timeSpent}s</span>`);
  
  setTimeout(() => {
    if (state.isReviewMode) {
      showNextReviewQuestion();
      return;
    }
    state.currentIndex++;
    if (state.currentIndex < state.questions.length) {
      showQuestion();
    } else {
      checkSkippedQuestions();
    }
  }, 1000);
}

function addUserAnswerBtn(answer, btn, correct, chosenValue) {
  if (answer === correct) btn.classList.add('correct');
  else {
    btn.classList.add('wrong');
    quickReplies.querySelectorAll('button').forEach(b => {
      if (b.dataset.letter === correct) b.classList.add('correct');
    });
  }
  if (isImageUrl(chosenValue)) {
    addUserMessageHTML(`<b>${answer}.</b><div class="opsi-img-wrap" style="max-width:140px;"><img src="${chosenValue}" alt="Pilihanku"></div>`);
  } else {
    addUserMessage(`${answer}. ${chosenValue}`);
  }
}

// ============ CHECK SKIPPED ============
async function checkSkippedQuestions() {
  if (state.skippedQuestions.length === 0) {
    await finishQuiz();
    return;
  }
  
  const count = state.skippedQuestions.length;
  await addBotMessage(`🔄 Kamu melewatkan <b>${count} soal</b>. Mau kembali menjawabnya?`);
  await addBotMessage('💡 Jawaban benar akan tetap menambah skor, tapi waktu terus berjalan!');
  
  showQuickReplies([
    { label: '✅ Ya, Jawab Sekarang', value: 'review', action: handleReviewChoice },
    { label: '🏁 Selesai Saja', value: 'finish', action: handleReviewChoice }
  ]);
}

async function handleReviewChoice(choice) {
  addUserMessage(choice === 'review' ? 'Ya, jawab sekarang' : 'Selesai saja');
  
  if (choice === 'finish') {
    await finishQuiz();
  } else {
    // Setup review mode
    state.isReviewMode = true;
    state.reviewQueue = state.skippedQuestions.map(sq => sq.originalIndex);
    state.skippedQuestions = []; // reset untuk track skip baru (jika ada)
    await addBotMessage(`🔥 Baik! Ada <b>${state.reviewQueue.length}</b> soal lewatan. Ayo kita selesaikan! 💪`);
    showNextReviewQuestion();
  }
}

function showNextReviewQuestion() {
  if (state.reviewQueue.length === 0) {
    checkSkippedQuestions();
    return;
  }
  state.currentIndex = state.reviewQueue.shift();
  showQuestion();
}

// ============ FINISH QUIZ ============
async function finishQuiz() {
  stopTotalTimer();
  updateProgress();
  progressFill.style.width = '100%';
  
  const total = state.questions.length * 10;
  const pct = Math.round((state.score / total) * 100);
  const timeFormatted = formatTime(state.totalTimeSpent);
  const correctCount = state.answeredCorrectly.size;

  let motivasi = '';
  if (pct === 100) 
  motivasi = '🏆 MasyaAllah! Sempurna! Prestasi luar biasa, terus pertahankan semangat belajarmu!';
else if (pct >= 80) 
  motivasi = '🌟 MasyaAllah, hebat sekali! Usahamu membuahkan hasil. Terus belajar dan raih yang lebih baik!';
else if (pct >= 60) 
  motivasi = '👍 Alhamdulillah, hasil yang baik! Terus tingkatkan ilmu dan jangan berhenti belajar!';
else if (pct >= 40) 
  motivasi = '💪 Tetap semangat! Setiap usaha adalah pahala. Terus berlatih dan yakin bisa lebih baik!';
else 
  motivasi = '📚 Jangan menyerah! Belajar adalah jalan menuju keberhasilan. Bismillah, coba lagi dan raih hasil terbaik!';

  await addBotMessage('🎉 <b>Alhamdulillah, Quiz Selesai!</b>');

  const card = document.createElement('div');
  card.className = 'result-card';
  card.innerHTML = `
    <h2>🏆 Hasil Quiz</h2>
    <div class="score">${state.score}/${total}</div>
    <div class="stats">
      <div class="stat-item">
        <div class="stat-value">${pct}%</div>
        <div class="stat-label">Nilai</div>
      </div>
      <div class="stat-item">
        <div class="stat-value">${correctCount}/${state.questions.length}</div>
        <div class="stat-label">Benar</div>
      </div>
      <div class="stat-item">
        <div class="stat-value">${timeFormatted}</div>
        <div class="stat-label">Waktu</div>
      </div>
    </div>
    <div class="motivation">"${motivasi}"</div>


  <button onclick="window.location.href = window.location.href;" class="refresh-btn">
    🔄 Mulai Lagi
  </button>
  `;
  chatArea.appendChild(card);
  scrollBottom();

  await addBotMessage('🔄 Mau main lagi? Tekan tombol Mulai Lagi');
  quickReplies.classList.add('hidden');
}

window.addEventListener('load', () => { setTimeout(startQuiz, 500); });
</script>

</body>
</html>
